# Pipeline settings. Curation lives here and in landmarks.yaml, never in the generated data.

source: set.mm

# set.mm's parts (its `####` headings) mapped to the subjects the mine is laid out and coloured by.
# A part not listed here is an error: a new part in a new pin must be placed on purpose.
subjects:
  - id: logic
    name: Logic
    parts: ["CLASSICAL FIRST-ORDER LOGIC WITH EQUALITY"]
  - id: sets
    name: Set theory
    parts:
      - "ZF (ZERMELO-FRAENKEL) SET THEORY"
      - "ZFC (ZERMELO-FRAENKEL WITH CHOICE) SET THEORY"
      - "TG (TARSKI-GROTHENDIECK) SET THEORY"
  - id: numbers
    name: Real and complex numbers
    parts: ["REAL AND COMPLEX NUMBERS"]
  - id: numtheory
    name: Number theory
    parts: ["ELEMENTARY NUMBER THEORY"]
  - id: structures
    name: Structures, order and categories
    parts: ["BASIC STRUCTURES", "BASIC CATEGORY THEORY", "BASIC ORDER THEORY"]
  - id: algebra
    name: Algebra
    parts: ["BASIC ALGEBRAIC STRUCTURES", "BASIC LINEAR ALGEBRA"]
  - id: topology
    name: Topology
    parts: ["BASIC TOPOLOGY"]
  - id: analysis
    name: Analysis
    parts: ["BASIC REAL AND COMPLEX ANALYSIS", "BASIC REAL AND COMPLEX FUNCTIONS"]
  - id: surreals
    name: Surreal numbers
    parts: ["SURREAL NUMBERS"]
  - id: geometry
    name: Geometry
    parts: ["ELEMENTARY GEOMETRY"]
  - id: graphs
    name: Graph theory
    parts: ["GRAPH THEORY"]
  - id: other
    name: Other
    parts:
      - "(before the first part)"
      - "GUIDES AND MISCELLANEA"
      - "COMPLEX TOPOLOGICAL VECTOR SPACES (DEPRECATED)"
      - "COMPLEX HILBERT SPACE EXPLORER (DEPRECATED)"
      - "SUPPLEMENTARY MATERIAL (USERS' MATHBOXES)"

# Every axiom in these subjects becomes a landmark. Axioms elsewhere (deprecated parts, user
# mathboxes, examples in the guides) stay hidden.
axiom_subjects: [logic, sets, numbers]

collapse:
  # Drop a tunnel A -> C when C is already reached through another landmark (A -> B -> C).
  # Reachability, and so every ancestor set, is unchanged; the picture loses the hairball.
  transitive_reduction: true

layout:
  metres_per_depth: 0.25 # vertical spacing: depth 464 is 116 m down
  inner_radius: 6 # metres: the open shaft in the middle of the mine
  outer_radius: 46
  min_spacing: 2.2 # metres between two landmarks at about the same depth
  iterations: 400
  seed: 7

# set.mm's latexdef for a few symbols uses LaTeX packages a web renderer lacks. These replace
# them with standard TeX that shows the same symbol. app/render/tex.test.ts typesets every
# statement and fails on anything left over.
latex_overrides:
  "[.": '\underset{\cdot}{[}' # dotted bracket of class substitution
  "].": '\underset{\cdot}{]}'
  "iota": "℩" # turned iota, the description operator
  "iota_": '\underline{℩}'
  "iota'": "℩'"
  "`": '\mathbin{\text{‘}}' # function application F ‘ A, as the Metamath site shows it
  ppi: '\pi' # the prime-counting function, written pi(x) as usual

# The Inside view: chambers and tunnels at human scale. pipeline/scene.py turns these into scene
# descriptors (data/scene.json); the app only renders them, so any engine draws the same mine.
inside:
  metres_per_depth: 0.25 # a tunnel drops exactly (depth difference) x this
  max_grade_deg: 20 # steepest tunnel slope, for comfort
  min_run: 16 # metres: shortest tunnel, measured horizontally
  max_turn_deg: 20 # a tunnel bends at most this much, left or right
  path_step: 4 # metres between points of a tunnel's polyline
  flat_ends: 3 # metres of level floor at each end of a tunnel
  chamber:
    min_radius: 8
    max_radius: 15 # a hall never grows past this; extra doorways become galleries
    radius_spread: 3 # seeded extra radius, 0..this
    base_height: 6
    height_spread: 2
    axiom_height_scale: 1.35
    dome_rise: 1.18 # the hall's ceiling at its centre, as a multiple of the wall height
    statement_arc: 11 # metres of wall kept for the statement
  # When the doorways do not fit on max_radius, each subject’s doorways move into one or more
  # wedges off the hall. A wedge is only as long as its own doors, and never longer than max_length.
  gallery:
    mouth: 3.2 # metres: narrowest opening from the hall into a wedge
    min_length: 4
    max_length: 20
    pillar_setback: 1.8 # metres inward from an outer doorway to its pillar
  statement_wall: { width: 9, height: 4.5, lift: 1.2 }
  portal: { gap: 1.6, height: 3.4 }
  tunnel:
    min_width: 2.4
    max_width: 5.0
    width_per_decade: 0.6 # wider by this per tenfold feeding lemmas
    ornament: [1, 10, 100, 1000] # feeding lemmas at which ornament levels 1..4 begin
    rib_spacing: [0, 8, 6, 4, 3] # metres between ribs at each ornament level (0: none)
  pillar: { ring: 0.62, min_ring: 4.5, min_radius: 0.35, max_radius: 0.7 }
  markers: { max: 12 }
  light: { surface: 1.0, deepest: 0.16 } # ambient light, falling exponentially with depth
  fog: { surface: 0.010, deepest: 0.030 }
  rock_darkening: 0.55 # rock colour at the deepest point, as a fraction of its surface colour
  rock:
    logic: "#8e9ab8"
    sets: "#7fa8a3"
    numbers: "#97ad7c"
    numtheory: "#b08b9c"
    structures: "#9a8fb3"
    algebra: "#b39a7f"
    topology: "#7f9fb3"
    analysis: "#b3a77b"
    surreals: "#a58fb3"
    geometry: "#86ad92"
    graphs: "#b38a8a"
    other: "#9aa0a6"

# The number theory plane (pipeline/plane_nt.py -> data/plane-number-theory.json). Layout and
# colour live here; every number the plane shows is computed by pipeline/numtheory.py.
number_theory_plane:
  limit: 100 # the road and the plaza go up to this number
  road:
    spacing: 2.0 # metres between column centres, along the road
    curve_amplitude: 0.35 # radians: the heading swings by this much either way
    curve_period: 200.0 # metres of road per swing
    step: 0.05 # metres: integration step for the centre line
    lead_in: 6.0 # metres of road behind column 1
    half_width: 4.0 # walkable half-width of the road
    arrival_offset: 2.4 # metres left of the centre line where the visitor arrives, so the stacks do not wall off the road
    block: 0.8 # metres: a block is a cube of this size
    block_gap: 0.03 # metres shaved off each block so the seams between blocks show
    thread_radius: 0.035
    labels: { number_height: 0.5, number_offset: 0.45, sign_offset: 1.3, sign_size: [3.6, 0.5] }
    monolith_width: 0.7
    monolith_blocks: 4 # a prime's monolith is this many block heights tall
    footprint: 0.6 # a column blocks walking within this radius
    seed: { width: 1.2, height: 0.15 }
    thread_points: 13
    thread_lift: 2.0 # metres: arc rise of a thread, plus thread_lift_per_metre for its length
    thread_lift_per_metre: 0.1
    thread_lift_max: 14.0
  hues:
    step: 3 # prime i gets hue 360 * ((step * i) mod K) / K; coprime to K, so neighbours differ
    strong_primes: 4 # 2, 3, 5, 7: the most saturated, as they appear most in stacks
    strong_saturation: 0.85
    strong_lightness: 0.5
    muted_saturation: [0.7, 0.55] # the rest, falling from first to last
    muted_lightness: [0.42, 0.55, 0.68] # cycled, so near hues also differ in lightness
  plaza:
    approach: 14.0 # straight road from column 100 to the plaza's near edge
    cell: 2.4 # metres between neighbouring columns of the grid
    margin: 3.0 # floor beyond the outer columns
    column: { width: 0.9, height: 1.4, rubble_height: 0.2 }
    crumble_step_s: 0.12 # seconds between one multiple crumbling and the next
    glow: "#e8c25a"
    stone: "#8d8f94"
    footprint: 0.7
    labels: { number_height: 0.4, number_offset: 0.3 }
  overlook:
    gap: 10.0 # metres from the plaza's far edge to x = 100
    x_end: 1000000
    metres_per_decade: 60.0
    windows_per_decade: 4
    window_span: 100 # consecutive integers shown at each window: a 10 by 10 panel, in reading order
    window_cell: 0.55 # metres between lights in a panel
    window_base: 1.0 # metres from the ground to the panel's lowest row
    curve_offset: 10.0 # metres to the left of the road
    curve_base: 2.0
    curve_height: 40.0 # metres of sky for pi(x_end)
    curve_width: 0.16 # metres: thickness of the curves
    ratio_scale: 60.0 # metres of sky per unit of ratio above 1, for the third curve
    samples_per_decade: 60
    marker_sign_lateral: 3.4 # metres left of the road: the sign stands beside the road, not in your way
    marker_sign_height: 2.6 # metres above the ground: the sign's centre
    marker_sign_size: [3.4, 1.35]
    label_height: 0.9
    tail: 14.0 # road beyond x_end
    arrival: 4.0 # metres before x = 100 where the visitor arrives
  texts:
    - id: arrive
      text: "Every whole number is built from primes in exactly one way. The road runs from {first} to {limit}: one stone column for each."
    - id: road
      text: "A prime stands alone as a tall monolith. Every other number is a stack of prime blocks, one for each prime factor, smallest at the bottom. The tallest stacks up to {limit} have {tallest_blocks} blocks: {tallest_list}. Look at a column to see what it is made of."
    - id: plaza
      text: "The numbers 2 to {limit} stand in a grid, in reading order. Strike a standing number and every multiple of it after itself crumbles. What is left standing is the primes."
    - id: sieve_note
      text: "After {small_primes}, striking anything else knocks nothing down: every composite up to {limit} has a prime factor no larger than {bound}, the square root of {limit}. The {survivors} that survive are the primes."
    - id: overlook
      text: "Past {limit} the road is drawn on a logarithmic scale out to {x_max}. Each patch of lights shows which of {window_span} consecutive whole numbers are prime. The curves count the primes up to x, written π(x), and compare it with x / ln x. At x = {x_max} there are {pi_max} primes against an estimate of about {est_max}: a ratio of {ratio_max}, still slowly falling toward 1."

# The cathedral prototype (pipeline/cathedral.py -> data/cathedral.json, pipeline/pathways.py ->
# data/pathways.json). Layout lives here and in the code; the app only renders it (CLAUDE.md rule 9).
# Yaw about +Y, heading(yaw) = (sin yaw, 0, cos yaw); a door's bearing b is the yaw of the
# direction from the hall centre to the door, so the far wall is 0, the left side is +90 (+X),
# the right side -90 and the entrance wall 180.
cathedral:
  hall:
    radius: 24 # metres from the centre to the doors
    wall_height: 14
    wall_thickness: 0.3 # metres, outward from the radius
    door: { width: 3.6, height: 6.5 }
    pedestal: { inset: 5, radius: 0.6, height: 1.1, preview_lift: 0.9 }
  # The visitor descends from the vault onto a dais at the centre of the hall, facing the far wall.
  # Four arcs of three doors use all twelve 30-degree slots, so no slot is free for a wall entrance.
  arrival: { dais_radius: 2.2 }
  slot_step_deg: 30
  # Each arc's doors sit at its centre bearing +30, 0 and -30 degrees: the first plane is leftmost
  # as the visitor looks at that arc from the middle of the hall.
  arcs:
    - { id: foundations, name: Foundations, placement: far-wall, centre_deg: 0 }
    - { id: discrete, name: Discrete, placement: left, centre_deg: 90 }
    - { id: structure, name: Structure, placement: right, centre_deg: -90 }
    - { id: space-change, name: Space and change, placement: entrance, centre_deg: 180 }
  planes:
    - { id: logic, name: Logic, arc: foundations, order: 0, preview: ring-motif }
    - { id: sets, name: Sets, arc: foundations, order: 1, preview: ring-motif }
    - { id: infinity, name: Infinity, arc: foundations, order: 2, preview: ring-motif }
    - { id: number-theory, name: Number theory, arc: discrete, order: 0, preview: prime-stacks }
    - { id: combinatorics, name: Combinatorics, arc: discrete, order: 1, preview: ring-motif }
    - { id: graph-theory, name: Graph theory, arc: discrete, order: 2, preview: ring-motif }
    - { id: algebra-symmetry, name: Algebra and symmetry, arc: structure, order: 0, preview: ring-motif }
    - { id: linear-algebra, name: Linear algebra, arc: structure, order: 1, preview: ring-motif }
    - { id: complex-numbers, name: Complex numbers, arc: structure, order: 2, preview: ring-motif }
    - { id: geometry, name: Geometry, arc: space-change, order: 0, preview: ring-motif }
    - { id: topology, name: Topology, arc: space-change, order: 1, preview: torus-cup }
    - { id: calculus-analysis, name: Calculus and analysis, arc: space-change, order: 2, preview: limit-curve }
  # Living previews on the pedestals. Only prime-stacks is drawn in the prototype.
  previews:
    prime-stacks:
      numbers: [6, 8, 12, 18, 24, 30] # towers; their blocks are the prime factors, computed
      block: 0.12 # metres per block
      ring_radius: 0.4 # towers stand on a circle this big
      period_s: 9 # one assembling cycle
      stagger_s: 0.6 # between one tower starting and the next
    limit-curve:
      samples: 48
      t_max: 12 # the curve y = 1 - 1/(1 + t) creeps toward the line y = 1
      width: 0.9
      height: 0.6
    torus-cup:
      torus: { major: 0.3, minor: 0.12 }
      steps: 5
    ring-motif:
      rings: 5
      min_sides: 3 # sides = min_sides + slot mod 6
  # The fractal threshold: a level tunnel of rings, each a Sierpinski triangle drawn at a constant
  # fraction of the one before, rotated a little more each time, closing round the visitor. It
  # ends high in the vault, over the entrance wall; the visitor drifts out of its mouth, turns
  # down and descends slowly onto the dais, facing the far wall. Every move is guided and
  # vignetted; the app eases the speed at the start, between segments and at the dais.
  threshold:
    motif_depth: 3
    rings: 48
    start_radius: 4.5 # the first rings stand just outside the 14 m wall, so they stay narrow enough to clear it
    end_radius: 1.8
    rotation_deg: 7.5
    straight: 22 # metres of level tunnel along +Z; the rings stand on it
    eye_height: 1.6 # metres: the path is where the visitor's feet go; rings are centred this far above it, at eye level
    entry_height: 16 # metres above the dais: inside the vault's first tier, 2 m over the wall
    corner: 2.5 # radius of the turn from drifting to descending
    path_step: 1 # metres between points of the rails path
    drift_speed: 1.6 # metres per second through the tunnel
    descent_speed: 1.2 # slower, for the vertical part
    vignette: { drift: 0.35, descent: 0.7 } # 0..1, how far the comfort vignette closes in
    ease_s: 1.5 # seconds to ramp the speed up, down, and between segments
  # The vault: twelve-sided rings above the wall, each a golden-ratio smaller than the last.
  vault:
    tiers: 7
    ratio: 0.618
    sides: 12
    rotation_deg: 15
    rise_per_tier: 0.5 # of the hall radius, shrinking by the ratio each tier

  # The pathway behind each door (pipeline/pathways.py). `entry_requires` are set.mm ids that must
  # all be earned for the door to glow; a door with none starts as frontier, and in the prototype
  # that is number theory only. Gates for planes without a stretch yet are placeholders (marked)
  # until those planes are built; each id must exist in the graph or the build fails.
  # `rubric` is a draft of what a good explanation says, used only by Trurl's judge, never shown.
  pathways:
    - plane: logic
      entry_requires: [ax-mp] # placeholder
      stretches: []
    - plane: sets
      entry_requires: [ax-ext] # placeholder
      stretches: []
    - plane: infinity
      entry_requires: [ax-inf] # placeholder
      stretches: []
    - plane: number-theory
      entry_requires: []
      stretches:
        - id: nt-1
          plane_data: plane-number-theory.json
          landmarks: [df-prm, 1arith]
          moments:
            - id: nt-1-road
              kind: road
              earns: [1arith]
              rubric: >-
                The visitor says that every whole number above 1 splits into primes in exactly one
                way, apart from the order, and can point at a number such as 12 or 60 to show it.
            - id: nt-1-sieve
              kind: sieve
              earns: [df-prm]
              rubric: >-
                The visitor says that a prime is a number whose only divisors are 1 and itself, and
                that after striking 2, 3, 5 and 7 nothing else falls because every composite up to
                100 has a prime factor of at most 10, which is the square root of 100.
    - plane: combinatorics
      entry_requires: [ramsey] # placeholder
      stretches: []
    - plane: graph-theory
      entry_requires: [konigsberg] # placeholder
      stretches: []
    - plane: algebra-symmetry
      entry_requires: [1arith] # dirith rests on both 1arith and ablfac, so this pathway meets number theory
      stretches: []
    - plane: linear-algebra
      entry_requires: [df-lmod] # placeholder
      stretches: []
    - plane: complex-numbers
      entry_requires: [efipi] # placeholder
      stretches: []
    - plane: geometry
      entry_requires: [df-trkg] # placeholder
      stretches: []
    - plane: topology
      entry_requires: [bwth] # placeholder
      stretches: []
    - plane: calculus-analysis
      entry_requires: [evth] # placeholder
      stretches: []
