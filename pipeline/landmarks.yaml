      reviewed: false
  - label: 'abstri'
    name: 'The triangle inequality'
    display:
      tex: '|A + B| \le |A| + |B|'
      reviewed: false
  - label: 'amgm'
    name: 'Inequality of arithmetic and geometric means'
    display:
      tex: '\Bigl(\prod_{a \in A} F(a)\Bigr)^{1/|A|} \le \frac{1}{|A|} \sum_{a \in A} F(a) \qquad (A \text{ finite, nonempty},\ F \ge 0)'
      reviewed: false
  - label: 'csbren'
    name: 'Cauchy–Schwarz inequality in $\mathbb{R}^n$'
    display:
      tex: '\Bigl(\sum_{k \in A} B_k C_k\Bigr)^2 \le \sum_{k \in A} B_k^2 \cdot \sum_{k \in A} C_k^2'
      reviewed: false
  - label: 'demoivre'
    name: 'De Moivre''s formula'
    display:
      tex: '(\cos A + i \sin A)^N = \cos(NA) + i \sin(NA) \qquad (N \in \mathbb{Z})'
      reviewed: false
  - label: 'infpn'
    name: 'There are infinitely many primes'
    display:
      tex: 'N \in \mathbb{N} \to \exists j\; (j > N \land j \text{ is prime})'
      reviewed: false
  - label: '1arith'
    name: 'Fundamental theorem of arithmetic'
    display:
      tex: 'n \mapsto \bigl(p \mapsto v_p(n)\bigr) \text{ is a bijection from } \mathbb{N} \text{ to the finitely supported } e : \text{Primes} \to \mathbb{N}_0'
      reviewed: false
  - label: 'euclemma'
    name: 'Euclid''s lemma'
    display:
      tex: 'p \text{ prime} \to \bigl(p \mid MN \leftrightarrow (p \mid M \lor p \mid N)\bigr)'
      reviewed: false
  - label: 'bezout'
    name: 'Bézout''s identity'
    display:
      tex: 'A, B \in \mathbb{Z} \to \exists x, y \in \mathbb{Z}\; \gcd(A, B) = Ax + By'
