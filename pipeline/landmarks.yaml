# Landmarks: the results the mine shows. Everything else stays hidden inside tunnels.
#
# This list is the only place curation happens (CLAUDE.md rule 3). Each entry names a statement in
# the pinned set.mm by its label, and gives it a human name. Every axiom in the parts listed under
# `axiom_parts` in config.yaml is added automatically; do not list axioms here.
#
# Each name was checked against set.mm's own description of the statement. When adding one, read
# that description first (python -m pipeline show LABEL) and name what it actually states.
#
#   - label: set.mm label
#     name: human name; inline math between $ signs is typeset (KaTeX) on the page and turned
#           into plain text for the 3D labels
#     subject: optional; overrides the subject that set.mm's part would give it
#     display: optional readable form of the statement
#       tex: LaTeX, written by hand from set.mm's statement (python -m pipeline show LABEL)
#       reviewed: false until a person has checked it against set.mm; the app flags drafts

landmarks:
  - label: 'id'
    name: 'Identity: $\varphi$ implies $\varphi$'
    display:
      tex: '\varphi \to \varphi'
      reviewed: false
  - label: 'syl'
    name: 'Syllogism (chaining implications)'
    display:
      tex: '\varphi \to \psi,\ \ \psi \to \chi \;\vdash\; \varphi \to \chi'
      reviewed: false
  - label: 'mpd'
    name: 'Modus ponens, deduction form'
    display:
      tex: '\varphi \to \psi,\ \ \varphi \to (\psi \to \chi) \;\vdash\; \varphi \to \chi'
      reviewed: false
  - label: 'con3'
    name: 'Contraposition'
    display:
      tex: '(\varphi \to \psi) \to (\neg\psi \to \neg\varphi)'
      reviewed: false
  - label: 'notnot'
    name: 'Double negation introduction'
    display:
      tex: '\varphi \to \neg\neg\varphi'
      reviewed: false
  - label: 'notnotr'
    name: 'Double negation elimination'
    display:
      tex: '\neg\neg\varphi \to \varphi'
      reviewed: false
  - label: 'pm2.21'
    name: 'Ex falso: a falsehood implies anything'
    display:
      tex: '\neg\varphi \to (\varphi \to \psi)'
      reviewed: false
  - label: 'exmid'
    name: 'Law of excluded middle'
    display:
      tex: '\varphi \lor \neg\varphi'
      reviewed: false
  - label: 'pm3.24'
    name: 'Law of noncontradiction'
    display:
      tex: '\neg(\varphi \land \neg\varphi)'
      reviewed: false
  - label: 'peirce'
    name: 'Peirce''s law'
    display:
      tex: '((\varphi \to \psi) \to \varphi) \to \varphi'
      reviewed: false
  - label: 'pm2.18'
    name: 'Clavius''s law'
    display:
      tex: '(\neg\varphi \to \varphi) \to \varphi'
      reviewed: false
  - label: 'mto'
    name: 'Modus tollens'
    display:
      tex: '\neg\psi,\ \ \varphi \to \psi \;\vdash\; \neg\varphi'
      reviewed: false
  - label: 'impexp'
    name: 'Import–export'
    display:
      tex: '((\varphi \land \psi) \to \chi) \leftrightarrow (\varphi \to (\psi \to \chi))'
      reviewed: false
  - label: 'ioran'
    name: 'De Morgan''s law (negated or)'
    display:
      tex: '\neg(\varphi \lor \psi) \leftrightarrow (\neg\varphi \land \neg\psi)'
      reviewed: false
  - label: 'anor'
    name: 'De Morgan''s law (and as or)'
    display:
      tex: '(\varphi \land \psi) \leftrightarrow \neg(\neg\varphi \lor \neg\psi)'
      reviewed: false
  - label: 'pm4.71'
    name: 'Implication as conjunction'
    display:
      tex: '(\varphi \to \psi) \leftrightarrow (\varphi \leftrightarrow (\varphi \land \psi))'
      reviewed: false
  - label: 'orcom'
    name: 'Disjunction is commutative'
    display:
      tex: '(\varphi \lor \psi) \leftrightarrow (\psi \lor \varphi)'
      reviewed: false
  - label: 'ancom'
    name: 'Conjunction is commutative'
    display:
      tex: '(\varphi \land \psi) \leftrightarrow (\psi \land \varphi)'
      reviewed: false
