  - label: 'eucalg'
    name: 'The Euclidean algorithm'
    display:
      tex: '\text{iterating } (x, y) \mapsto (y,\ x \bmod y) \text{ from } (M, N),\ N \text{ times, ends at } \gcd(M, N)'
      reviewed: false
  - label: 'eulerth'
    name: 'Euler''s theorem'
    display:
      tex: '\gcd(A, N) = 1 \to A^{\varphi(N)} \equiv 1 \pmod{N}'
      reviewed: false
  - label: 'fermltl'
    name: 'Fermat''s little theorem'
    display:
      tex: 'p \text{ prime} \to A^p \equiv A \pmod{p}'
      reviewed: false
  - label: 'wilth'
    name: 'Wilson''s theorem'
    display:
      tex: 'N \text{ prime} \leftrightarrow \bigl(N \ge 2 \land N \mid (N-1)! + 1\bigr)'
      reviewed: false
  - label: 'crth'
    name: 'Chinese remainder theorem'
    display:
      tex: '\gcd(M, N) = 1 \to x \mapsto (x \bmod M,\ x \bmod N) \text{ is a bijection } \{0, \ldots, MN-1\} \to \{0, \ldots, M-1\} \times \{0, \ldots, N-1\}'
      reviewed: false
  - label: 'pythagtrip'
    name: 'Pythagorean triples'
    display:
      tex: 'A^2 + B^2 = C^2 \leftrightarrow \exists n, m, k \in \mathbb{N}\; \bigl(\{A, B\} = \{k(m^2 - n^2),\ 2kmn\} \land C = k(m^2 + n^2)\bigr)'
      reviewed: false
  - label: 'lgsquad'
    name: 'Law of quadratic reciprocity'
    display:
      tex: '\Bigl(\frac{P}{Q}\Bigr)\Bigl(\frac{Q}{P}\Bigr) = (-1)^{\frac{P-1}{2} \cdot \frac{Q-1}{2}} \qquad (P \neq Q \text{ odd primes})'
      reviewed: false
  - label: '2sq'
    name: 'Primes of the form $4k+1$ are sums of two squares'
    display:
      tex: '(p \text{ prime} \land p \equiv 1 \pmod 4) \to \exists x, y \in \mathbb{Z}\; p = x^2 + y^2'
      reviewed: false
  - label: '4sq'
    name: 'Lagrange''s four-square theorem'
    display:
      tex: 'A \in \mathbb{N}_0 \leftrightarrow \exists a, b, c, d \in \mathbb{Z}\; A = a^2 + b^2 + c^2 + d^2'
      reviewed: false
  - label: 'perfect'
    name: 'Euclid–Euler theorem on perfect numbers'
    display:
      tex: 'N \text{ even} \to \bigl(\sigma(N) = 2N \leftrightarrow \exists p\,(2^p - 1 \text{ prime} \land N = 2^{p-1}(2^p - 1))\bigr)'
      reviewed: false
  - label: 'bpos'
    name: 'Bertrand''s postulate'
    display:
      tex: 'N \in \mathbb{N} \to \exists p \text{ prime}\; N < p \le 2N'
      reviewed: false
  - label: 'dirith'
    name: 'Dirichlet''s theorem on primes in progressions'
    display:
      tex: '\gcd(A, N) = 1 \to \{p \text{ prime} : p \equiv A \pmod{N}\} \approx \mathbb{N}'
      reviewed: false
  - label: 'pnt'
    name: 'Prime number theorem'
    display:
      tex: '\lim_{x \to \infty} \frac{\pi(x)}{x / \ln x} = 1'
      reviewed: false
  - label: 'prmrec'
    name: 'The sum of prime reciprocals diverges'
    display:
      tex: '\sum_{p \text{ prime}} \frac{1}{p} \text{ diverges}'
      reviewed: false
  - label: 'basel'
    name: 'The Basel problem: $\sum 1/n^2 = \pi^2/6$'
    display:
      tex: '\sum_{k=1}^{\infty} \frac{1}{k^2} = \frac{\pi^2}{6}'
      reviewed: false
  - label: '3dvds'
    name: 'Divisibility by 3'
    display:
      tex: '3 \;\Big|\; \sum_{k=0}^{N} F(k)\, 10^k \;\leftrightarrow\; 3 \;\Big|\; \sum_{k=0}^{N} F(k)'
      reviewed: false
  - label: 'ramsey'
    name: 'Ramsey''s theorem'
    display:
      tex: '\exists n\; \forall s\; \Bigl(|s| \ge n \to \forall f : \tbinom{s}{M} \to R\;\; \exists c \in R\; \exists x \subseteq s\; \bigl(|x| \ge F(c) \land \tbinom{x}{M} \subseteq f^{-1}(c)\bigr)\Bigr)'
      reviewed: false
  - label: 'vdw'
    name: 'Van der Waerden''s theorem'
    display:
      tex: 'R \text{ finite} \to \exists n\; \forall f : \{1, \ldots, n\} \to R\;\; \exists c, a, d\;\; \{a, a + d, \ldots, a + (K-1)d\} \subseteq f^{-1}(c)'
      reviewed: false
  - label: 'df-mnd'
    name: 'Definition of a monoid'
  - label: 'df-grp'
    name: 'Definition of a group'
  - label: 'df-abl'
    name: 'Definition of an abelian group'
  - label: 'df-ring'
    name: 'Definition of a ring'
  - label: 'df-cring'
    name: 'Definition of a commutative ring'
  - label: 'df-field'
    name: 'Definition of a field'
  - label: 'df-lmod'
    name: 'Definition of a module'
  - label: 'df-lvec'
    name: 'Definition of a vector space'
  - label: 'lagsubg'
    name: 'Lagrange''s theorem on subgroups'
    display:
      tex: '(Y \le G,\ G \text{ finite}) \to |Y| \text{ divides } |G|'
      reviewed: false
  - label: 'sylow1'
    name: 'First Sylow theorem'
    display:
      tex: 'p^N \mid |G| \to \exists H \le G\; |H| = p^N'
      reviewed: false
  - label: 'sylow2'
    name: 'Second Sylow theorem'
    display:
      tex: 'H, K \text{ Sylow } p\text{-subgroups} \to \exists g \in G\; H = gKg^{-1}'
      reviewed: false
  - label: 'sylow3'
    name: 'Third Sylow theorem'
    display:
      tex: 'n_p \;\Big|\; \frac{|G|}{p^{v_p(|G|)}} \;\land\; n_p \equiv 1 \pmod{p}'
      reviewed: false
  - label: 'cayley'
    name: 'Cayley''s theorem'
    display:
      tex: 'g \mapsto (a \mapsto g a) \text{ is an isomorphism from } G \text{ onto a subgroup of } \mathrm{Sym}(G)'
      reviewed: false
  - label: 'ablfac'
    name: 'Fundamental theorem of finite abelian groups'
    display:
      tex: '\text{a finite abelian group is the direct product of cyclic } p\text{-groups}'
      reviewed: false
  - label: 'lbsex'
    name: 'Every vector space has a basis'
    display:
      tex: 'W \text{ a vector space} \to W \text{ has a basis}'
      reviewed: false
  - label: 'df-mat'
    name: 'Definition of matrices'
  - label: 'df-mdet'
    name: 'Definition of the determinant'
  - label: 'mdetmul'
    name: 'The determinant of a product'
    display:
      tex: '\det(FG) = \det F \cdot \det G'
      reviewed: false
  - label: 'cramer'
    name: 'Cramer''s rule'
    display:
      tex: '\det X \text{ a unit} \to \Bigl(XZ = Y \leftrightarrow Z_i = \frac{\det X_i(Y)}{\det X} \text{ for each } i\Bigr), \quad X_i(Y) = X \text{ with column } i \text{ replaced by } Y'
      reviewed: false
  - label: 'cayleyhamilton'
    name: 'Cayley–Hamilton theorem'
    display:
      tex: '\chi_M(M) = 0'
      reviewed: false
  - label: 'df-top'
    name: 'Definition of a topology'
  - label: 'df-cld'
    name: 'Definition of closed sets'
  - label: 'df-cn'
    name: 'Definition of a continuous function'
  - label: 'df-cmp'
    name: 'Definition of a compact space'
  - label: 'df-haus'
    name: 'Definition of a Hausdorff space'
  - label: 'df-conn'
    name: 'Definition of a connected space'
  - label: 'df-met'
    name: 'Definition of a metric'
  - label: 'icccmp'
    name: 'A closed interval is compact (Heine–Borel)'
    display:
      tex: '[A, B] \text{ is compact}'
      reviewed: false
  - label: 'bwth'
    name: 'Bolzano–Weierstrass theorem'
    display:
      tex: '(X \text{ compact} \land A \subseteq X \text{ infinite}) \to A \text{ has a limit point in } X'
      reviewed: false
  - label: 'ptcmp'
    name: 'Tychonoff''s theorem'
    display:
      tex: '\text{a product of compact spaces is compact}'
      reviewed: false
  - label: 'bcth'
    name: 'Baire category theorem'
    display:
      tex: 'X \text{ complete},\ M_k \text{ closed},\ \textstyle\bigcup_k M_k \text{ has interior} \to \text{some } M_k \text{ has interior}'
      reviewed: false
  - label: 'ivth'
    name: 'Intermediate value theorem (increasing case)'
    display:
      tex: 'F \text{ continuous on } [A, B],\ F(A) < U < F(B) \to \exists c \in (A, B)\; F(c) = U'
      reviewed: false
  - label: 'evth'
    name: 'Extreme value theorem'
    display:
      tex: 'X \text{ compact, nonempty},\ F : X \to \mathbb{R} \text{ continuous} \to \exists x\; \forall y\; F(y) \le F(x)'
      reviewed: false
  - label: 'rolle'
    name: 'Rolle''s theorem'
    display:
      tex: 'F(A) = F(B) \to \exists x \in (A, B)\; F^{\prime}(x) = 0'
      reviewed: false
  - label: 'mvth'
    name: 'Mean value theorem'
    display:
      tex: '\exists x \in (A, B)\; F^{\prime}(x) = \frac{F(B) - F(A)}{B - A}'
      reviewed: false
  - label: 'dvmul'
    name: 'The product rule'
    display:
      tex: '(FG)^{\prime}(C) = F^{\prime}(C)\, G(C) + G^{\prime}(C)\, F(C)'
      reviewed: false
  - label: 'dvco'
    name: 'The chain rule'
    display:
      tex: '(F \circ G)^{\prime}(C) = F^{\prime}(G(C))\, G^{\prime}(C)'
      reviewed: false
  - label: 'lhop'
    name: 'L''Hôpital''s rule'
    display:
      tex: 'F, G \to 0 \text{ at } B,\ \ \frac{F^{\prime}(z)}{G^{\prime}(z)} \to C \;\vdash\; \frac{F(z)}{G(z)} \to C \text{ as } z \to B'
      reviewed: false
  - label: 'ftc1'
    name: 'Fundamental theorem of calculus, part 1'
    display:
      tex: 'G(x) = \int_A^x F(t)\, dt,\ F \text{ continuous at } C \to G^{\prime}(C) = F(C)'
      reviewed: false
  - label: 'ftc2'
    name: 'Fundamental theorem of calculus, part 2'
    display:
      tex: '\int_A^B F^{\prime}(t)\, dt = F(B) - F(A)'
      reviewed: false
  - label: 'itgsubst'
    name: 'Integration by substitution'
    display:
      tex: '\int_{A(X)}^{A(Y)} C(u)\, du = \int_X^Y C(A(x))\, A^{\prime}(x)\, dx'
      reviewed: false
  - label: 'taylth'
    name: 'Taylor''s theorem'
    display:
      tex: '\lim_{x \to B} \frac{F(x) - T_N(x)}{(x - B)^N} = 0 \qquad (T_N \text{ the degree-}N \text{ Taylor polynomial at } B)'
      reviewed: false
  - label: 'fta'
    name: 'Fundamental theorem of algebra'
    display:
      tex: '\deg F \ge 1 \to \exists z \in \mathbb{C}\; F(z) = 0'
      reviewed: false
  - label: 'abelth'
    name: 'Abel''s theorem on power series'
    display:
      tex: '\sum_n a_n \text{ converges} \to x \mapsto \sum_{n} a_n x^n \text{ is continuous on } \{z : |1 - z| \le M(1 - |z|)\}'
      reviewed: false
  - label: 'leibpi'
    name: 'Leibniz formula for $\pi$'
    display:
      tex: '\sum_{n=0}^{\infty} \frac{(-1)^n}{2n + 1} = \frac{\pi}{4}'
      reviewed: false
  - label: 'trirecip'
    name: 'Sum of reciprocals of triangular numbers'
    display:
      tex: '\sum_{k=1}^{\infty} \frac{2}{k(k + 1)} = 2'
      reviewed: false
  - label: 'mcubic'
    name: 'Solution of the monic cubic'
    display:
      tex: 'X^3 + BX^2 + CX + D = 0 \leftrightarrow \exists r\,\Bigl(r^3 = 1 \land X = -\frac{B + rT + M/(rT)}{3}\Bigr) \qquad (M, T \text{ from Cardano})'
      reviewed: false
  - label: 'quart'
    name: 'Solution of the quartic'
    display:
      tex: 'X^4 + AX^3 + BX^2 + CX + D = 0 \leftrightarrow X \in \{E - S \pm I,\ E + S \pm J\} \qquad (\text{Ferrari})'
      reviewed: false
  - label: 'facth'
    name: 'The factor theorem'
    display:
      tex: 'F(A) = 0 \to F = (x - A) \cdot \bigl(F \operatorname{quot} (x - A)\bigr)'
      reviewed: false
  - label: 'lawcos'
    name: 'Law of cosines'
    display:
      tex: 'c^2 = a^2 + b^2 - 2ab \cos\gamma'
      reviewed: false
  - label: 'heron'
    name: 'Heron''s formula'
    display:
      tex: '\tfrac{1}{2} ab\, |\sin\gamma| = \sqrt{s(s - a)(s - b)(s - c)}, \quad s = \tfrac{a + b + c}{2}'
      reviewed: false
  - label: 'ptolemy'
    name: 'Ptolemy''s theorem'
    display:
      tex: 'A + B + C + D = \pi \to \sin A \sin B + \sin C \sin D = \sin(B + C) \sin(A + C)'
      reviewed: false
  - label: 'chordthm'
    name: 'Intersecting chords theorem'
    display:
      tex: '|PA| \cdot |PB| = |PC| \cdot |PD| \qquad (\text{chords } AB,\ CD \text{ crossing at } P)'
      reviewed: false
  - label: 'ang180'
    name: 'Angle sum of a triangle is $\pm\pi$'
    display:
      tex: '\alpha + \beta + \gamma = \pm\pi \qquad (\text{signed angles of a triangle})'
      reviewed: false
  - label: 'isosctr'
    name: 'Isosceles triangle theorem'
    display:
      tex: '|AC| = |BC| \to \angle A = \angle B'
      reviewed: false
  - label: 'incexc'
    name: 'Inclusion–exclusion principle'
    display:
      tex: '\Bigl|\bigcup A\Bigr| = \sum_{\emptyset \neq s \subseteq A} (-1)^{|s| - 1} \Bigl|\bigcap s\Bigr|'
      reviewed: false
  - label: 'birthday'
    name: 'The birthday problem'
    display:
      tex: '\frac{365 \cdot 364 \cdots 343}{365^{23}} < \frac{1}{2}'
      reviewed: false
  - label: 'df-cat'
    name: 'Definition of a category'
  - label: 'df-func'
    name: 'Definition of a functor'
  - label: 'yoneda'
    name: 'Yoneda lemma'
    display:
      tex: '\mathrm{Nat}\bigl(\mathrm{Hom}(-, X),\ F\bigr) \cong F(X), \text{ naturally in } F \text{ and } X'
      reviewed: false
  - label: 'df-poset'
    name: 'Definition of a partially ordered set'
  - label: 'df-lat'
    name: 'Definition of a lattice'
  - label: 'knatar'
    name: 'Knaster–Tarski fixed-point theorem'
    display:
      tex: 'F \text{ monotone on } \mathcal{P}(A),\ F(A) \subseteq A \to F(X) = X, \quad X = \textstyle\bigcap \{z \subseteq A : F(z) \subseteq z\}'
      reviewed: false
  - label: 'df-no'
    name: 'Definition of the surreal numbers'
  - label: 'df-trkg'
    name: 'Definition of a Tarski geometry'
  - label: 'df-uhgr'
    name: 'Definition of a hypergraph'
  - label: 'df-eupth'
    name: 'Definition of an Eulerian path'
  - label: 'konigsberg'
    name: 'The Königsberg bridge problem'
    display:
      tex: '\text{the K\"onigsberg graph has no Eulerian path}'
      reviewed: false
  - label: 'friendship'
    name: 'The friendship theorem'
    display:
      tex: '\text{a finite friendship graph has a vertex adjacent to every other}'
      reviewed: false
  # Hubs: early results that most later ones pass through. Each one gathers tunnels that would
  # otherwise all run to the surface separately.
  - label: 'eqid'
    name: 'Law of identity: $A = A$'
    display:
      tex: 'A = A'
      reviewed: false
  - label: 'isset'
    name: 'A class is a set exactly when it exists'
    display:
      tex: 'A \in V \leftrightarrow \exists x\; x = A'
      reviewed: false
  - label: '0re'
    name: '0 is a real number'
    display:
      tex: '0 \in \mathbb{R}'
      reviewed: false
  - label: '1re'
    name: '1 is a real number'
    display:
      tex: '1 \in \mathbb{R}'
      reviewed: false
  - label: 'recn'
    name: 'Every real number is a complex number'
    display:
      tex: 'A \in \mathbb{R} \to A \in \mathbb{C}'
      reviewed: false
  - label: 'addcom'
    name: 'Addition is commutative (proved, not assumed)'
    display:
      tex: 'A + B = B + A \qquad (A, B \in \mathbb{C})'
      reviewed: false
  - label: 'mul01'
    name: 'Anything times 0 is 0'
    display:
      tex: 'A \cdot 0 = 0'
      reviewed: false
  - label: 'ltnr'
    name: 'No real number is less than itself'
    display:
      tex: '\neg(A < A)'
      reviewed: false
  - label: 'lttri'
    name: '''Less than'' is transitive'
    display:
      tex: '(A < B \land B < C) \to A < C'
      reviewed: false
  - label: '1p1e2'
    name: '$1 + 1 = 2$'
    display:
      tex: '1 + 1 = 2'
      reviewed: false
  - label: '2p2e4'
    name: '$2 + 2 = 4$'
    display:
      tex: '2 + 2 = 4'
      reviewed: false
  - label: 'nnssre'
    name: 'The positive integers are real numbers'
    display:
      tex: '\mathbb{N} \subseteq \mathbb{R}'
      reviewed: false
  - label: 'zssre'
    name: 'The integers are real numbers'
    display:
      tex: '\mathbb{Z} \subseteq \mathbb{R}'
      reviewed: false
  - label: 'qssre'
    name: 'The rationals are real numbers'
    display:
      tex: '\mathbb{Q} \subseteq \mathbb{R}'
      reviewed: false

# Names for the axioms, which are added automatically. Each is set.mm's own name for the axiom,
# or a plain reading of what its description says it states.
axiom_names:
  ax-mp: 'Modus ponens (rule of inference)'
  ax-1: 'Axiom Simp: $\varphi \to (\psi \to \varphi)$'
  ax-2: 'Axiom Frege: distributing an antecedent'
  ax-3: 'Axiom Transp: transposition'
  ax-gen: 'Rule of generalization'
  ax-4: 'Axiom of quantified implication'
  ax-5: 'Axiom of distinctness'
  ax-6: 'Axiom of existence'
  ax-7: 'Axiom of equality'
  ax-8: 'Axiom of left equality for ∈'
  ax-9: 'Axiom of right equality for ∈'
  ax-10: 'Axiom of quantified negation'
  ax-11: 'Axiom of quantifier commutation'
  ax-12: 'Axiom of substitution'
  ax-13: 'Axiom of quantified equality'
  ax-ext: 'Axiom of extensionality'
  ax-rep: 'Axiom of replacement'
  ax-sep: 'Axiom of separation'
  ax-nul: 'Null set axiom'
  ax-pow: 'Axiom of power sets'
  ax-pr: 'Axiom of pairing'
  ax-un: 'Axiom of union'
  ax-reg: 'Axiom of regularity (foundation)'
  ax-inf: 'Axiom of infinity'
  ax-inf2: 'Axiom of infinity, standard form'
  ax-ac: 'Axiom of choice'
  ax-ac2: 'Axiom of choice, textbook form'
  ax-cc: 'Axiom of countable choice'
  ax-dc: 'Axiom of dependent choice'
  ax-groth: 'Tarski–Grothendieck axiom (inaccessible cardinals)'
  ax-cnex: 'The complex numbers form a set'
  ax-resscn: 'The reals are a subset of the complex numbers'
  ax-1cn: '1 is a complex number'
  ax-icn: 'i is a complex number'
  ax-addcl: 'Complex addition is closed'
  ax-addrcl: 'Real addition is closed'
  ax-mulcl: 'Complex multiplication is closed'
  ax-mulrcl: 'Real multiplication is closed'
  ax-mulcom: 'Multiplication is commutative'
  ax-addass: 'Addition is associative'
  ax-mulass: 'Multiplication is associative'
  ax-distr: 'Multiplication distributes over addition'
  ax-i2m1: '$i^2 = -1$'
  ax-1ne0: '$1 \neq 0$'
  ax-1rid: '1 is a multiplicative identity for the reals'
  ax-rnegex: 'Every real has a negative'
  ax-rrecex: 'Every nonzero real has a reciprocal'
  ax-cnre: 'Every complex number is a + bi for reals a, b'
  ax-pre-lttri: 'Trichotomy of < on the reals'
  ax-pre-lttrn: '< on the reals is transitive'
  ax-pre-ltadd: 'Adding preserves < on the reals'
  ax-pre-mulgt0: 'The product of two positive reals is positive'
  ax-pre-sup: 'Completeness: a bounded nonempty set of reals has a supremum'
  ax-addf: 'Addition is an operation on ℂ (deprecated axiom)'
  ax-mulf: 'Multiplication is an operation on ℂ'
