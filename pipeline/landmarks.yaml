  - label: 'ru'
    name: 'Russell''s paradox'
    display:
      tex: '\{x \mid x \notin x\} \notin V'
      reviewed: false
  - label: 'vex'
    name: 'Every set variable is a set'
    display:
      tex: 'x \in V'
      reviewed: false
  - label: '0ex'
    name: 'The empty set exists'
    display:
      tex: '\emptyset \in V'
      reviewed: false
  - label: 'prex'
    name: 'An unordered pair of sets exists'
    display:
      tex: '\{A, B\} \in V'
      reviewed: false
  - label: 'opth'
    name: 'The ordered pair theorem'
    display:
      tex: 'A, B \in V \;\vdash\; \langle A, B \rangle = \langle C, D \rangle \leftrightarrow (A = C \land B = D)'
      reviewed: false
  - label: 'pwex'
    name: 'The power set of a set exists'
    display:
      tex: 'A \in V \;\vdash\; \mathcal{P}(A) \in V'
      reviewed: false
  - label: 'uniex'
    name: 'The union of a set exists'
    display:
      tex: 'A \in V \;\vdash\; \textstyle\bigcup A \in V'
      reviewed: false
  - label: 'zfrep6'
    name: 'Replacement, a classical form'
    display:
      tex: '\forall x \in z\; \exists! y\, \varphi \to \exists w\, \forall x \in z\; \exists y \in w\; \varphi'
      reviewed: false
  - label: 'ordon'
    name: 'The ordinals form an ordinal'
    display:
      tex: '\mathrm{On} \text{ is an ordinal}'
      reviewed: false
  - label: 'onprc'
    name: 'Burali-Forti paradox: the ordinals are a proper class'
    display:
      tex: '\mathrm{On} \notin V'
      reviewed: false
  - label: 'omex'
    name: '$\omega$ exists (axiom of infinity)'
    display:
      tex: '\omega \in V'
      reviewed: false
  - label: 'peano1'
    name: 'Peano postulate: zero is a natural number'
    display:
      tex: '\emptyset \in \omega'
      reviewed: false
  - label: 'peano2'
    name: 'Peano postulate: successors are natural numbers'
    display:
      tex: 'A \in \omega \to \operatorname{suc} A \in \omega'
      reviewed: false
  - label: 'peano3'
    name: 'Peano postulate: zero is not a successor'
    display:
      tex: 'A \in \omega \to \operatorname{suc} A \neq \emptyset'
      reviewed: false
  - label: 'peano4'
    name: 'Peano postulate: the successor is one-to-one'
    display:
      tex: 'A, B \in \omega \to (\operatorname{suc} A = \operatorname{suc} B \leftrightarrow A = B)'
      reviewed: false
  - label: 'peano5'
    name: 'Peano postulate: induction'
    display:
      tex: '\bigl(\emptyset \in A \land \forall x \in \omega\,(x \in A \to \operatorname{suc} x \in A)\bigr) \to \omega \subseteq A'
      reviewed: false
  - label: 'findes'
    name: 'Finite induction'
    display:
      tex: '\varphi(\emptyset),\ \ x \in \omega \to (\varphi(x) \to \varphi(\operatorname{suc} x)) \;\vdash\; x \in \omega \to \varphi(x)'
      reviewed: false
  - label: 'tfis'
    name: 'Transfinite induction'
    display:
      tex: 'x \in \mathrm{On} \to \bigl(\forall y \in x\; \varphi(y) \to \varphi(x)\bigr) \;\vdash\; x \in \mathrm{On} \to \varphi(x)'
      reviewed: false
  - label: 'tfr1'
    name: 'Transfinite recursion'
    display:
      tex: 'F = \operatorname{recs}(G) \;\vdash\; F \text{ is a function with domain } \mathrm{On}'
      reviewed: false
  - label: 'canth'
    name: 'Cantor''s theorem: no set maps onto its power set'
    display:
      tex: 'A \in V \;\vdash\; \text{no } F \text{ maps } A \text{ onto } \mathcal{P}(A)'
      reviewed: false
  - label: 'sbth'
    name: 'Schröder–Bernstein theorem'
    display:
      tex: '(A \preccurlyeq B \land B \preccurlyeq A) \to A \approx B'
      reviewed: false
  - label: 'php'
    name: 'Pigeonhole principle'
    display:
      tex: '(A \in \omega \land B \subsetneq A) \to A \not\approx B'
      reviewed: false
  - label: 'weth'
    name: 'Well-ordering theorem'
    display:
      tex: 'A \in V \to \exists x\; (x \text{ well-orders } A)'
      reviewed: false
  - label: 'zorn'
    name: 'Zorn''s lemma'
    display:
      tex: 'A \in V \;\vdash\; \forall z \bigl((z \subseteq A \land \subsetneq \text{ totally orders } z) \to \textstyle\bigcup z \in A\bigr) \to \exists x \in A\; \forall y \in A\; \neg(x \subsetneq y)'
      reviewed: false
  - label: 'ttukey'
    name: 'Teichmüller–Tukey lemma'
    display:
      tex: 'A \in V \;\vdash\; \bigl(A \neq \emptyset \land \forall x\,(x \in A \leftrightarrow \mathcal{P}(x) \cap \mathrm{Fin} \subseteq A)\bigr) \to \exists x \in A\; \forall y \in A\; \neg(x \subsetneq y)'
      reviewed: false
  - label: 'ac2'
    name: 'Axiom of choice, equivalent form'
    display:
      tex: '\exists y\; \forall z \in x\; \forall w \in z\; \exists! v \in z\; \exists u \in y\; (z \in u \land v \in u)'
      reviewed: false
  - label: 'cardon'
    name: 'Every cardinal is an ordinal'
    display:
      tex: '\operatorname{card}(A) \in \mathrm{On}'
      reviewed: false
  - label: 'alephon'
    name: 'Every aleph is an ordinal'
    display:
      tex: '\aleph(A) \in \mathrm{On}'
      reviewed: false
  - label: 'hashpw'
    name: 'A set with $n$ elements has $2^n$ subsets'
    display:
      tex: 'A \text{ finite} \to |\mathcal{P}(A)| = 2^{|A|}'
      reviewed: false
  - label: 'hashbc'
    name: 'Number of combinations'
    display:
      tex: '(A \text{ finite} \land K \in \mathbb{Z}) \to \binom{|A|}{K} = \bigl|\{x \subseteq A : |x| = K\}\bigr|'
      reviewed: false
