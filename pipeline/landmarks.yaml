    name: 'Definition of the Lebesgue integral'
  - label: 'sup3'
    name: 'Completeness: a bounded set of reals has a supremum'
    display:
      tex: '\bigl(A \subseteq \mathbb{R},\ A \neq \emptyset,\ A \text{ bounded above}\bigr) \to \exists x \in \mathbb{R}\,\bigl(\forall y \in A\; y \le x \;\land\; \forall y \in \mathbb{R}\,(y < x \to \exists z \in A\; y < z)\bigr)'
      reviewed: false
  - label: 'arch'
    name: 'Archimedean property of the reals'
    display:
      tex: 'A \in \mathbb{R} \to \exists n \in \mathbb{N}\; A < n'
      reviewed: false
  - label: 'nnind'
    name: 'Principle of mathematical induction'
    display:
      tex: '\varphi(1),\ \ \forall y \in \mathbb{N}\,(\varphi(y) \to \varphi(y+1)) \;\vdash\; A \in \mathbb{N} \to \varphi(A)'
      reviewed: false
  - label: 'qbtwnre'
    name: 'Between any two reals lies a rational'
    display:
      tex: '(A, B \in \mathbb{R} \land A < B) \to \exists x \in \mathbb{Q}\; A < x < B'
      reviewed: false
  - label: 'sqrt2irr'
    name: 'The square root of 2 is irrational'
    display:
      tex: '\sqrt{2} \notin \mathbb{Q}'
      reviewed: false
  - label: 'ruc'
    name: 'The reals are uncountable'
    display:
      tex: '\mathbb{N} \prec \mathbb{R}'
      reviewed: false
  - label: 'qnnen'
    name: 'The rationals are countable'
    display:
      tex: '\mathbb{Q} \approx \mathbb{N}'
      reviewed: false
  - label: 'rpnnen'
    name: 'The reals have the cardinality of the power set of $\mathbb{N}$'
    display:
      tex: '\mathbb{R} \approx \mathcal{P}(\mathbb{N})'
      reviewed: false
  - label: 'binom'
    name: 'The binomial theorem'
    display:
      tex: '(A + B)^N = \sum_{k=0}^{N} \binom{N}{k} A^{N-k} B^{k}'
      reviewed: false
  - label: 'geoser'
    name: 'Sum of a finite geometric series'
    display:
      tex: 'A \neq 1 \to \sum_{k=0}^{N-1} A^k = \frac{1 - A^N}{1 - A}'
      reviewed: false
  - label: 'arisum'
    name: 'Sum of an arithmetic series'
    display:
      tex: '\sum_{k=1}^{N} k = \frac{N^2 + N}{2}'
      reviewed: false
  - label: 'efipi'
    name: 'Euler''s identity: $e^{i\pi} = -1$'
    display:
